name: Verify V1
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          set-safe-directory: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            extension/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Repository-only bootstrap assertions
        run: |
          git config --local user.email akshatjain0410@gmail.com
          git config --local user.name myjobai-ci
          git remote set-url origin https://github.com/akshatjain04/job-search-platform
      - run: npm ci && npm test && npm run audit:repository
      - run: mvn -f backend/pom.xml -Pformat spotless:check -B -ntp
      - run: ./scripts/bootstrap-and-run.sh --demo
      - run: npm run format:check
      - name: Browser acceptance
        run: |
          cd web
          npx playwright install --with-deps chromium
          npm run e2e
      - run: node scripts/restart-test.mjs
      - name: Container failure diagnostics
        if: failure()
        env:
          APP_ENV_FILE: .env.test.example
        run: docker compose --env-file .env.test.example -f docker-compose.yml -f docker-compose.test.yml logs --tail 80
      - name: Production Compose syntax
        env:
          APP_ENV_FILE: .env.example
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: |
            backend/**/target/surefire-reports/
            backend/platform-resume/target/test-artifacts/
            web/playwright-report/
            web/test-results/
      - name: Safe shutdown
        if: always()
        run: ./scripts/stop.sh --demo
