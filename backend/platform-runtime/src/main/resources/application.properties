spring.application.name=myjobai-${APP_ROLE:api}
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:0.0.0.0}
server.shutdown=graceful
server.forward-headers-strategy=framework
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.flyway.schemas=app
spring.flyway.default-schema=app
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.structured.format.console=logstash
logging.threshold.console=INFO
logging.level.org.springframework.security=WARN
logging.level.root=INFO
logging.level.org.springframework=INFO
debug=false
trace=false
server.error.include-message=never
server.error.include-stacktrace=never
