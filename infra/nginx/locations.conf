root /usr/share/nginx/html;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
location = /healthz { access_log off; return 200 'ok'; }
location ~ ^/api/v1/auth/(login|test-login|extension/token)$ {
  limit_req zone=auth_limit burst=20 nodelay;
  proxy_pass http://job-platform-api:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
}
location /api/ {
  limit_req zone=api_limit burst=30 nodelay;
  proxy_pass http://job-platform-api:8080;
  proxy_read_timeout 90s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
}
location /v3/api-docs {
  proxy_pass http://job-platform-api:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api-health {
  proxy_pass http://job-platform-api:8080/actuator/health/readiness;
}
location = /mcp {
  limit_req zone=api_limit burst=30 nodelay;
  proxy_pass http://job-platform-mcp:8080;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 90s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
}
location /assets/ { try_files $uri =404; expires 1y; }
location = /myjobai-extension.zip { try_files $uri =404; }
location / { try_files $uri $uri/ /index.html; }
