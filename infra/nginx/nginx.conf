worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  # Docker may assign new addresses when services restart or are replaced.
  resolver 127.0.0.11 valid=1s ipv6=off;
  resolver_timeout 5s;
  upstream platform_api {
    zone platform_api 64k;
    server job-platform-api:8080 resolve;
  }
  upstream platform_mcp {
    zone platform_mcp 64k;
    server job-platform-mcp:8080 resolve;
  }
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout safe;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 11m;
  client_body_timeout 20s;
  keepalive_timeout 30s;
  limit_req_zone $binary_remote_addr zone=api_limit:1m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:1m rate=10r/m;
  limit_req_status 429;
  include /etc/nginx/conf.d/*.conf;
}
